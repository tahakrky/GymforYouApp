name: Uygulamaları derle (Windows .exe + Android .apk)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  # GitHub: Settings > Secrets and variables > Actions > Variables > API_URL
  VITE_API_BASE: ${{ vars.API_URL }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Frontend
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build:native
      - name: Electron installer
        working-directory: desktop
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: GymForYou-Windows
          path: desktop/release/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Frontend
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build:native
      - name: Android projesi + APK
        working-directory: mobile
        run: |
          npm install
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GymForYou-Android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
